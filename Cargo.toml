[package]
name = "sec-gateway"
version = "0.1.0"
edition = "2021"
authors = ["geekheitian"]

[lib]
name = "sec_gateway"
path = "src/lib.rs"

[[bin]]
name = "sec-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
regex = "1.10"
fpe = "0.6"
aes = "0.8"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }
bytes = { version = "1.0", features = ["serde"] }
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1"
